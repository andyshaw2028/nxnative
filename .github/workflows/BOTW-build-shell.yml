name: Build BOTW iOS Shell IPA

on:
  workflow_dispatch:

jobs:
  build-ios-shell:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew install cmake ninja spirv-cross glslang xcodegen

      - name: Generate Xcode Project with CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build iOS App with xcodebuild
        run: |
          cd build
          xcodebuild -project *.xcodeproj \
                     -scheme nxnative \
                     -configuration Release \
                     -sdk iphoneos \
                     -arch arm64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package Standalone Shell IPA
        run: |
          # 1. 创建标准的 App 沙盒包目录结构
          mkdir -p Payload/nxnative.app

          # 2. 查找编译好的 .app 目录或二进制文件并复制
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/" Payload/nxnative.app/
          else
            echo "Error: No built .app directory found!"
            exit 1
          fi

          # 3. 动态注入/更新开启文件共享与大内存权限的 Info.plist
          cat << 'EOF' > Payload/nxnative.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>nxnative</string>
              <key>CFBundleIdentifier</key>
              <string>com.recomp.botw</string>
              <key>CFBundleName</key>
              <string>Zelda BOTW</string>
              <key>CFBundleDisplayName</key>
              <string>Zelda BOTW</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <!-- 开启 iOS 应用文件共享（必须） -->
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <!-- 允许申请更大内存（解决大游戏内存溢出闪退） -->
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 4. 打包为无游戏数据的空壳 IPA
          zip -r BOTW-iOS-Shell.ipa Payload

      - name: Upload Shell Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOTW-iOS-Shell-IPA
          path: BOTW-iOS-Shell.ipa
