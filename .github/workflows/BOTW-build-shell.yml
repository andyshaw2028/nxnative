name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Inspect Script Validation Logic
      run: |
        echo "=== Searching for title ID validation logic in script ==="
        grep -n -C 5 "no NSP with a readable title ID" scripts/build_ipa_from_nsp.py || true
      shell: bash

    - name: Download and Prepare Core Package
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        mkdir -p test_env
        unzip -q botw_core.zip -d test_env/
        ls -la test_env/
        ls -la test_env/botw_core/ || true
      shell: bash

    - name: Run Build Script (Diagnostic)
      run: |
        KEYS_FILE=$(find test_env -name "prod.keys" | head -n 1)
        python3 scripts/build_ipa_from_nsp.py -k "$KEYS_FILE" test_env/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
