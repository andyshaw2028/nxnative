
    - name: Build Lightweight Shell IPA
      shell: bash
      run: |
        set -euo pipefail

        echo "=== 1. Verify lightweight core ==="
        test -d workspace_core/botw_core || {
          echo "[ERROR] Lightweight core directory missing"
          exit 1
        }

        echo "=== 2. Build IPA ==="
        python3 scripts/build_ipa_from_nsp.py \
          --app-name "The Legend of Zelda: Breath of the Wild" \
          --out workspace_core/ZeldaBreathOfTheWild.ipa \
          -k prod.keys \
          workspace_core/

        echo "=== 3. Verify generated IPA ==="
        IPA="workspace_core/ZeldaBreathOfTheWild.ipa"
        test -s "$IPA" || {
          echo "[ERROR] IPA missing or empty"
          exit 1
        }

        unzip -t "$IPA"

        echo "=== 4. Verify app bundle and executable ==="
        rm -rf ipa_verify
        mkdir -p ipa_verify
        unzip -q "$IPA" -d ipa_verify

        APP_PATH="ipa_verify/Payload/DmIOS.app"
        if [ ! -d "$APP_PATH" ]; then
          APP_PATH="$(find ipa_verify/Payload -maxdepth 2 \
            -type d -name '*.app' -print -quit)"
        fi

        test -n "$APP_PATH" && test -d "$APP_PATH" || {
          echo "[ERROR] No app bundle found inside IPA"
          exit 1
        }

        /usr/libexec/PlistBuddy \
          -c 'Print :CFBundleExecutable' \
          "$APP_PATH/Info.plist"

        EXEC_NAME=$(/usr/libexec/PlistBuddy \
          -c 'Print :CFBundleExecutable' \
          "$APP_PATH/Info.plist")

        test -s "$APP_PATH/$EXEC_NAME" || {
          echo "[ERROR] App executable missing: $EXEC_NAME"
          exit 1
        }

        echo "=== 5. Inspect memory entitlement ==="
        codesign -d --entitlements :- \
          "$APP_PATH/$EXEC_NAME" \
          > ipa_verify/entitlements.plist 2>&1 || true

        if grep -q 'com.apple.developer.kernel.increased-memory-limit' \
          ipa_verify/entitlements.plist; then
          echo "[OK] Increased Memory Limit entitlement found"
        else
          echo "[WARN] Entitlement not confirmed in extracted IPA"
          cat ipa_verify/entitlements.plist
        fi

        echo "=== IPA ready ==="
        ls -lh "$IPA"

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: workspace_core/ZeldaBreathOfTheWild.ipa
