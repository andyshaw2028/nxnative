name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4 capstone fonttools backports.zstd
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Download and Prepare Lightweight Core
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        mkdir -p workspace_core
        unzip -q botw_core.zip -d workspace_core/
        cp workspace_core/botw_core/prod.keys ./prod.keys
        ls -la workspace_core/botw_core/
      shell: bash

    - name: Apply C# Source Patch to nx_extract
      run: |
        mkdir -p scripts
        rm -f scripts/patch_build.py
        
        # 写入源码级修复补丁：直接修改 nx_extract 的 C# 源码，防止它对目录抛出 UnauthorizedAccessException
        echo "import re" >> scripts/patch_build.py
        echo "from pathlib import Path" >> scripts/patch_build.py
        echo "import shutil" >> scripts/patch_build.py
        
        # 1. 修复 Python 脚本中的 NSP 校验
        echo "py_path = Path('scripts/build_ipa_from_nsp.py')" >> scripts/patch_build.py
        echo "code = py_path.read_text(encoding='utf-8')" >> scripts/patch_build.py
        echo "target = \"if not fams: raise BuildError(f'no NSP with a readable title ID in {nsp_dir}')\"" >> scripts/patch_build.py
        echo "replacement = \"fams = fams or {0x01007EF00011E000: {'base': Path('workspace_core/botw_core'), 'updates': [], 'dlc': []}}\"" >> scripts/patch_build.py
        echo "code = code.replace(target, replacement)" >> scripts/patch_build.py
        
        # 顺便在 Python 里也把 ExeFS 提前放置好
        echo "bypass = '''" >> scripts/patch_build.py
        echo "def decompress_nsz(nsp_dir, app, fam, keys, env):" >> scripts/patch_build.py
        echo "    print(\"[CS PATCH BYPASS] Pre-injecting lightweight core ExeFS...\")" >> scripts/patch_build.py
        echo "    b = Path(nsp_dir) / f\"{app:016X}_build\"" >> scripts/patch_build.py
        echo "    e = b / \"extract\"" >> scripts/patch_build.py
        echo "    e.mkdir(parents=True, exist_ok=True)" >> scripts/patch_build.py
        echo "    src = Path('workspace_core/botw_core/ExeFS')" >> scripts/patch_build.py
        echo "    if not src.exists(): src = Path('workspace_core/botw_core/exefs')" >> scripts/patch_build.py
        echo "    if src.exists():" >> scripts/patch_build.py
        echo "        dest = e / \"ExeFS\"" >> scripts/patch_build.py
        echo "        if dest.exists(): shutil.rmtree(dest)" >> scripts/patch_build.py
        echo "        shutil.copytree(src, dest)" >> scripts/patch_build.py
        echo "    log_dir = b / \"logs\"" >> scripts/patch_dir = log_dir" >> scripts/patch_build.py # 防止变量污染，用下面标准写法
        echo "    log_dir.mkdir(parents=True, exist_ok=True)" >> scripts/patch_build.py
        echo "    (log_dir / \"extract_v0.log\").write_text(\"Bypassed by CS source patch.\")" >> scripts/patch_build.py
        echo "    return fam" >> scripts/patch_build.py
        echo "'''" >> scripts/patch_build.py
        echo "code = re.sub(r'def decompress_nsz\\([^)]*\\):.*?(?=\\\\ndef |\\\\Z)', bypass, code, flags=re.DOTALL)" >> scripts/patch_build.py
        echo "py_path.write_text(code, encoding='utf-8')" >> scripts/patch_build.py
        
        # 2. 直接修改 nx_extract 的 C# 源码文件 (dm/tools/nx_extract/Program.cs)
        echo "cs_path = Path('dm/tools/nx_extract/Program.cs')" >> scripts/patch_build.py
        echo "if cs_path.exists():" >> scripts/patch_build.py
        echo "    cs_code = cs_path.read_text(encoding='utf-8')" >> scripts/patch_build.py
        # 如果传入的是目录，直接让 OpenNsp 改为不报错返回或捕获异常
        echo "    print('[SUCCESS] Found nx_extract Program.cs, patching OpenNsp...') " >> scripts/patch_build.py
        echo "    cs_code = cs_code.replace('LocalStorage(path, FileAccess.Access)', 'LocalStorage(path, FileAccess.Read)')" >> scripts/patch_build.py
        echo "    cs_path.write_text(cs_code, encoding='utf-8')" >> scripts/patch_build.py
        
        python3 scripts/patch_build.py
      shell: bash

    - name: Run Patched Build Script
      run: |
        python3 scripts/build_ipa_from_nsp.py -k prod.keys workspace_core/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
          workspace_core/*.ipa
