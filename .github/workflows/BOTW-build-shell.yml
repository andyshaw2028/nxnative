name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Download and Inspect BotW Core
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        
        echo "Extracting core package..."
        mkdir -p temp_extracted
        unzip -q botw_core.zip -d temp_extracted/
        
        echo "=== Printing Full File Tree of Extracted Core ==="
        find temp_extracted -print
      shell: bash

    - name: Run Build Script (Test)
      run: |
        KEYS_FILE=$(find temp_extracted -name "prod.keys" | head -n 1)
        # 尝试将解压后的根目录直接传给脚本
        python3 scripts/build_ipa_from_nsp.py -k "$KEYS_FILE" temp_extracted/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
