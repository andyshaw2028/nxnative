name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        # 安装项目运行所需的 Python 库（特别是报错缺失的 lz4）
        python3 -m pip install lz4
        # 如果仓库里有 requirements.txt，顺便把它装上
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Download BotW Core (exefs & keys)
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        echo "Extracting core package..."
        unzip botw_core.zip -d input_core/
        ls -la input_core/

    - name: Run Build Script with Correct Arguments
      run: |
        # 查找 keys 文件的实际路径
        KEYS_FILE=$(find input_core -name "prod.keys" | head -n 1)
        echo "Found keys file at: $KEYS_FILE"

        # 运行打包脚本：使用 -k 指定密钥，并将包含 exefs 的目录作为参数传入
        python3 scripts/build_ipa_from_nsp.py -k "$KEYS_FILE" input_core/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
