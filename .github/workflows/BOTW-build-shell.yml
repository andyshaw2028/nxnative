name: Build iOS Native App Shell

on:
  workflow_dispatch: # 允许你在网页上手动点击按钮触发构建

jobs:
  build:
    runs-on: macos-latest # 关键：调用 GitHub 提供的云端 Mac 虚拟机

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (Homebrew)
      run: |
        brew install xcodegen zstd spirv-cross glslang

    - name: Run iOS Build Script
      run: |
        # 这里对应项目官方的构建命令（根据你实际的项目脚本路径调整）
        python3 scripts/build_ipa_from_nsp.py --platform ios || python3 build_app.py
      shell: bash

    - name: Upload Artifact (IPA)
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
