name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up .NET Core (Required for other tools if needed)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4 capstone fonttools backports.zstd
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Download and Prepare Lightweight Core
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        
        mkdir -p workspace_core
        unzip -q botw_core.zip -d workspace_core/
        
        # 复制一份密钥到根目录方便调用
        cp workspace_core/botw_core/prod.keys ./prod.keys
        ls -la workspace_core/botw_core/
      shell: bash

    - name: Patch Build Script to Bypass nx_extract & Use ExeFS Directly
      run: |
        python3 - << 'EOF'
        script_path = "scripts/build_ipa_from_nsp.py"
        with open(script_path, "r", encoding="utf-8") as f:
            content = f.read()

        # 1. 绕过 NSP 校验
        target_code = "if not fams: raise BuildError(f'no NSP with a readable title ID in {nsp_dir}')"
        replacement_code = "fams = fams or {0x01007EF00011E000: {'base': Path('workspace_core/botw_core'), 'updates': [], 'dlc': []}}"
        if target_code in content:
            content = content.replace(target_code, replacement_code)

        # 2. 热补丁 decompress_nsz 或 extract 阶段：
        # 当脚本尝试调用 nx_extract 提取 v0 时，我们直接把现成的 ExeFS 复制到对应的 extract 目标目录中，从而避免 nx_extract 报错
        # 让我们找到运行 nx_extract 的地方并注入旁路复制逻辑
        patch_target = "def decompress_nsz"
        if patch_target in content:
            print("[INFO] Found decompress_nsz function, injecting direct ExeFS copy bypass...")
            # 在 decompress_nsz 头部注入：如果检测到我们传入的是轻量核心，直接软链接/复制 ExeFS 到目标位置并返回
            injection = """
def decompress_nsz(nsp_dir, app, fam, keys, env):
    # --- [CUSTOM BYPASS FOR LIGHTWEIGHT CORE] ---
    import shutil
    print("[BYPASS] Using direct ExeFS from lightweight core package...")
    build_dir = Path(nsp_dir) / f"{app:016X}_build"
    extract_dir = build_dir / "extract"
    extract_dir.mkdir(parents=True, exist_ok=True)
    
    # 寻找我们解压出来的 ExeFS 路径
    src_exefs = Path('workspace_core/botw_core/ExeFS')
    if not src_exefs.exists():
        src_exefs = Path('workspace_core/botw_core/exefs')
        
    if src_exefs.exists():
        dest_exefs = extract_dir / "ExeFS"
        if dest_exefs.exists():
            shutil.rmtree(dest_exefs)
        shutil.copytree(src_exefs, dest_exefs)
        print(f"[BYPASS] Successfully copied ExeFS from {src_exefs} to {dest_exefs}")
    
    # 同时确保 main 和其他必要标识存在
    return fam
            """
            # 我们用正则或简单替换覆盖原函数体
            import re
            content = re.sub(r'def decompress_nsz\([^)]*\):.*?(?=\ndef |\n[a-zA-Z_])', injection, content, flags=re.DOTALL)

        with open(script_path, "w", encoding="utf-8") as f:
            f.write(content)
        print("[SUCCESS] Successfully patched build script to bypass nx_extract!")
        EOF
      shell: bash

    - name: Run Patched Build Script
      run: |
        python3 scripts/build_ipa_from_nsp.py -k prod.keys workspace_core/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
          workspace_core/*.ipa
