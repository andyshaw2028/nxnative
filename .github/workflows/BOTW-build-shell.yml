name: Build BOTW iOS Shell IPA

on:
  workflow_dispatch:

jobs:
  build-ios-shell:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS Build Dependencies
        run: |
          # 1. 安装核心编译工具（去掉引起报错的 pipx）
          brew install xcodegen zstd spirv-cross glslang

          # 2. 使用安全合规的 --user 模式安装 Python 解包依赖，避开 PEP 668 报错
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user lz4 capstone fonttools zstd

      - name: Generate Xcode Project using xcodegen
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          else
            find . -name "project.yml" -execdir xcodegen generate \;
          fi

      - name: Build iOS App with xcodebuild
        run: |
          XCODEPROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then
            echo "Error: No .xcodeproj generated!"
            exit 1
          fi

          xcodebuild -project "$XCODEPROJ" \
                     -configuration Release \
                     -sdk iphoneos \
                     -arch arm64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package Standalone Shell IPA
        run: |
          mkdir -p Payload/nxnative.app

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/" Payload/nxnative.app/
          else
            echo "Error: No built .app directory found!"
            exit 1
          fi

          # 注入 Info.plist（包含文件共享与大内存特权）
          cat << 'EOF' > Payload/nxnative.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>nxnative</string>
              <key>CFBundleIdentifier</key>
              <string>com.recomp.botw</string>
              <key>CFBundleName</key>
              <string>Zelda BOTW</string>
              <key>CFBundleDisplayName</key>
              <string>Zelda BOTW</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <!-- 开启文件共享 -->
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <!-- 解锁大内存特权，防止旷野之息加载崩后台 -->
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          zip -r BOTW-iOS-Shell.ipa Payload

      - name: Upload Shell Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOTW-iOS-Shell-IPA
          path: BOTW-iOS-Shell.ipa
