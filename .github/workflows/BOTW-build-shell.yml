name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Download and Arrange BotW Core
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        
        echo "Extracting core package..."
        mkdir -p workspace_game
        unzip -q botw_core.zip -d workspace_game/
        
        # 调整目录结构：将 botw_core 内部的文件直接展平或规范化
        # 如果解压出来是 workspace_game/botw_core/ExeFS，我们将其对齐
        if [ -d workspace_game/botw_core ]; then
          mv workspace_game/botw_core/* workspace_game/
          rmdir workspace_game/botw_core
        fi
        
        echo "=== Final Workspace Structure ==="
        ls -la workspace_game/
        ls -la workspace_game/ExeFS/ || ls -la workspace_game/exefs/ || true
      shell: bash

    - name: Run Build Script
      run: |
        KEYS_FILE="workspace_game/prod.keys"
        echo "Using keys file: $KEYS_FILE"

        # 直接将整理好的工作目录传给构建脚本
        python3 scripts/build_ipa_from_nsp.py -k "$KEYS_FILE" workspace_game/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
