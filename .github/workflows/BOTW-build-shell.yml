
name: Build BotW iOS Native Shell

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install macOS build and Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen zstd spirv-cross glslang

          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools backports.zstd

          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi

          if [ -f scripts/requirements.txt ]; then
            python3 -m pip install -r scripts/requirements.txt
          fi

      - name: Download and prepare lightweight core
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading lightweight core package..."

          if ! curl -fL --retry 3 \
            -o botw_core.zip \
            "https://github.com/user-attachments/files/34022482/botw_core.zip"; then
            curl -fL --retry 3 \
              -o botw_core.zip \
              "https://github.2aik.dev/https://github.com/user-attachments/files/34022482/botw_core.zip"
          fi

          test -s botw_core.zip
          unzip -t botw_core.zip
          mkdir -p workspace_core
          unzip -q botw_core.zip -d workspace_core/

          test -f workspace_core/botw_core/prod.keys || {
            echo "[ERROR] prod.keys missing from lightweight core package"
            exit 1
          }

          cp workspace_core/botw_core/prod.keys ./prod.keys

          mkdir -p workspace_core/botw_core/extract/v0/RomFS/Pack
          mkdir -p workspace_core/botw_core/RomFS/Pack
          mkdir -p workspace_core/01007EF00011E000_build/ipa/data/v0

          dd if=/dev/zero \
            of=workspace_core/botw_core/extract/v0/RomFS/Pack/Bootup_Graphics.pack \
            bs=1024 count=1

          dd if=/dev/zero \
            of=workspace_core/botw_core/RomFS/Pack/Bootup_Graphics.pack \
            bs=1024 count=1

          dd if=/dev/zero \
            of=workspace_core/botw_core/extract/v0/control.nacp \
            bs=1024 count=16

          dd if=/dev/zero \
            of=workspace_core/botw_core/control.nacp \
            bs=1024 count=16

          dd if=/dev/zero \
            of=workspace_core/01007EF00011E000_build/ipa/data/v0/control.nacp \
            bs=1024 count=16

      - name: Run dedicated patch script
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_build.py

      - name: Build lightweight shell IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="workspace_core/ZeldaBreathOfTheWild.ipa"

          echo "=== Building IPA ==="

          python3 scripts/build_ipa_from_nsp.py \
            --app-name "The Legend of Zelda: Breath of the Wild" \
            --out "$IPA" \
            -k prod.keys \
            workspace_core/

          echo "=== Checking generated IPA ==="

          test -s "$IPA" || {
            echo "[ERROR] Build did not produce the expected IPA: $IPA"
            find workspace_core -maxdepth 5 -type f \
              \( -name '*.ipa' -o -name '*.log' \) -print
            exit 1
          }

          unzip -t "$IPA"

          echo "=== Checking app executable ==="

          VERIFY_DIR="ipa_verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA" -d "$VERIFY_DIR"

          APP_EXECUTABLE="$(find "$VERIFY_DIR/Payload" \
            -type f -name 'DmIOS' -print -quit)"

          test -n "$APP_EXECUTABLE" || {
            echo "[ERROR] DmIOS executable not found inside IPA"
            find "$VERIFY_DIR/Payload" -maxdepth 4 -print
            exit 1
          }

          APP_PATH="${APP_EXECUTABLE%/DmIOS}"

          test -f "$APP_PATH/Info.plist" || {
            echo "[ERROR] App Info.plist missing: $APP_PATH"
            exit 1
          }

          echo "App path: $APP_PATH"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP_PATH/Info.plist"

          echo "=== Inspecting memory entitlement ==="

          if codesign -d --entitlements :- "$APP_EXECUTABLE" \
            > entitlement-check.plist 2>&1; then
            if grep -q \
              'com.apple.developer.kernel.increased-memory-limit' \
              entitlement-check.plist; then
              echo "[OK] Increased Memory Limit entitlement found"
            else
              echo "[WARN] Entitlement was not confirmed"
              cat entitlement-check.plist
            fi
          else
            echo "[WARN] Could not inspect executable entitlements"
            cat entitlement-check.plist
          fi

          echo "=== IPA validation complete ==="
          ls -lh "$IPA"

      - name: Upload built IPA
        uses: actions/upload-artifact@v4
        with:
          name: BotW-iOS-IPA
          if-no-files-found: error
          path: workspace_core/ZeldaBreathOfTheWild.ipa
