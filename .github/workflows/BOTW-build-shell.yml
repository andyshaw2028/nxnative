name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Download and Unpack Core Package
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        
        mkdir -p workspace_core
        unzip -q botw_core.zip -d workspace_core/
        
        echo "=== Extracted Contents ==="
        ls -la workspace_core/
        ls -la workspace_core/botw_core/ || true
      shell: bash

    - name: Patch Build Script to Accept ExeFS Directly
      run: |
        # 我们可以通过在脚本运行前动态创建一个软链接，或者在工作流中直接构建一个符合它期望的虚拟容器
        # 让我们把 botw_core 里的 ExeFS 和 prod.keys 映射到构建脚本能直接识别的环境中
        
        # 方案：在脚本里直接放宽对 fams 的强校验，或者为它生成一个轻量的占位结构
        echo "Preparing build environment..."
        KEYS_FILE=$(find workspace_core -name "prod.keys" | head -n 1)
        EXFS_DIR=$(find workspace_core -type d -name "ExeFS" -o -name "exefs" | head -n 1)
        
        echo "Keys found at: $KEYS_FILE"
        echo "ExeFS found at: $EXFS_DIR"
        
        # 将 keys 复制到脚本期望的根目录
        cp "$KEYS_FILE" ./prod.keys
      shell: bash

    - name: Run Build Script
      run: |
        # 尝试直接调用并传入核心路径
        python3 scripts/build_ipa_from_nsp.py -k prod.keys workspace_core/botw_core/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
