name: Build BOTW iOS Shell IPA

on:
  workflow_dispatch:

jobs:
  build-ios-shell:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS Build Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools zstd

      - name: Generate Xcode Project using xcodegen
        run: |
          # 检查是否存在 project.yml 并用 xcodegen 动态构建工程
          if [ -f "project.yml" ]; then
            xcodegen generate
          else
            echo "project.yml not found, searching project definition..."
            find . -name "project.yml" -execdir xcodegen generate \;
          fi

      - name: Build iOS App with xcodebuild
        run: |
          # 自动寻找生成的 xcodeproj 并编译 arm64 无签名二进制包
          XCODEPROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ" ]; then
            echo "Error: No .xcodeproj generated!"
            exit 1
          fi

          xcodebuild -project "$XCODEPROJ" \
                     -configuration Release \
                     -sdk iphoneos \
                     -arch arm64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package Standalone Shell IPA
        run: |
          # 1. 创建标准的 App 沙盒包结构
          mkdir -p Payload/nxnative.app

          # 2. 找到编译产物并复制放入 Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/" Payload/nxnative.app/
          else
            echo "Error: No built .app directory found!"
            exit 1
          fi

          # 3. 注入开启“文件共享”与“大内存特权”的 Info.plist
          cat << 'EOF' > Payload/nxnative.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>nxnative</string>
              <key>CFBundleIdentifier</key>
              <string>com.recomp.botw</string>
              <key>CFBundleName</key>
              <string>Zelda BOTW</string>
              <key>CFBundleDisplayName</key>
              <string>Zelda BOTW</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <!-- 开启文件共享（关键：使爱思助手能够浏览并注入 Documents 文件夹） -->
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <!-- 解锁内存上限至 ~6GB，防止旷野之息加载大场景时直接溢出崩溃 -->
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 4. 打包输出 Shell IPA
          zip -r BOTW-iOS-Shell.ipa Payload

      - name: Upload Shell Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOTW-iOS-Shell-IPA
          path: BOTW-iOS-Shell.ipa
