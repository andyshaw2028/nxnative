name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Download and Prepare BotW Core Structure
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        
        echo "Preparing mock NSP directory structure for BotW..."
        mkdir -p mock_nsp/01007EF00011E000
        
        # 解压到临时目录
        unzip -q botw_core.zip -d temp_extracted/
        
        # 将 exefs 和 keys 移动到符合 Title ID 的标准结构中
        find temp_extracted -type d -name "exefs" -exec cp -r {} mock_nsp/01007EF00011E000/ \;
        find temp_extracted -type f -name "prod.keys" -exec cp {} mock_nsp/ \;
        
        echo "=== Checking mock_nsp structure ==="
        ls -la mock_nsp/
        ls -la mock_nsp/01007EF00011E000/ || true

    - name: Run Build Script with Mock Structure
      run: |
        KEYS_FILE="mock_nsp/prod.keys"
        echo "Using keys file at: $KEYS_FILE"

        # 将伪造好的 Title ID 目录传给打包脚本
        python3 scripts/build_ipa_from_nsp.py -k "$KEYS_FILE" mock_nsp/01007EF00011E000/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
