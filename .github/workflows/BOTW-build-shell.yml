name: Build BotW iOS Native Shell

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮运行

jobs:
  build:
    runs-on: macos-latest # 使用云端 macOS 环境进行编译

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install macOS build & Python dependencies
      run: |
        brew install xcodegen zstd spirv-cross glslang
        python3 -m pip install --upgrade pip
        python3 -m pip install lz4 capstone fonttools backports.zstd
        if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
        if [ -f scripts/requirements.txt ]; then python3 -m pip install -r scripts/requirements.txt; fi

    - name: Download and Prepare Lightweight Core
      run: |
        echo "Downloading lightweight core package (27MB)..."
        curl -L -o botw_core.zip "https://github.com/user-attachments/files/34022482/botw_core.zip"
        mkdir -p workspace_core
        unzip -q botw_core.zip -d workspace_core/
        cp workspace_core/botw_core/prod.keys ./prod.keys
        ls -la workspace_core/botw_core/
      shell: bash

    - name: Apply C# Source Patch and Python Bypass
      run: |
        python3 -c "
        import re
        from pathlib import Path
        import shutil

        # 1. 修复主构建脚本中的 NSP 校验
        py_path = Path('scripts/build_ipa_from_nsp.py')
        if py_path.exists():
            code = py_path.read_text(encoding='utf-8')
            target = \"if not fams: raise BuildError(f'no NSP with a readable title ID in {nsp_dir}')\"
            replacement = \"fams = fams or {0x01007EF00011E000: {'base': Path('workspace_core/botw_core'), 'updates': [], 'dlc': []}}\"
            code = code.replace(target, replacement)

            bypass = '''
def decompress_nsz(nsp_dir, app, fam, keys, env):
    print(\"[CS PATCH BYPASS] Pre-injecting lightweight core ExeFS...\")
    b = Path(nsp_dir) / f\"{app:016X}_build\"
    e = b / \"extract\"
    e.mkdir(parents=True, exist_ok=True)
    src = Path('workspace_core/botw_core/ExeFS')
    if not src.exists(): src = Path('workspace_core/botw_core/exefs')
    if src.exists():
        dest = e / \"ExeFS\"
        if dest.exists(): shutil.rmtree(dest)
        shutil.copytree(src, dest)
        print(f\"[CS PATCH BYPASS] Copied ExeFS to {dest}\")
    log_dir = b / \"logs\"
    log_dir.mkdir(parents=True, exist_ok=True)
    (log_dir / \"extract_v0.log\").write_text(\"Bypassed by CS source patch.\")
    return fam
'''
            code = re.sub(r'def decompress_nsz\\([^)]*\\):.*?(?=\\\\ndef |\\\\Z)', bypass, code, flags=re.DOTALL)
            py_path.write_text(code, encoding='utf-8')
            print('[SUCCESS] Python script patched successfully.')

        # 2. 直接修改 nx_extract 的 C# 源码，防止目录访问抛出异常
        cs_path = Path('dm/tools/nx_extract/Program.cs')
        if cs_path.exists():
            cs_code = cs_path.read_text(encoding='utf-8')
            print('[SUCCESS] Found nx_extract Program.cs, patching source...')
            cs_code = cs_code.replace('LocalStorage(path, FileAccess.Access)', 'LocalStorage(path, FileAccess.Read)')
            cs_path.write_text(cs_code, encoding='utf-8')
        "
      shell: bash

    - name: Run Patched Build Script
      run: |
        python3 scripts/build_ipa_from_nsp.py -k prod.keys workspace_core/
      shell: bash

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotW-iOS-IPA
        path: |
          *.ipa
          **/output/*.ipa
          **/build/*.ipa
          workspace_core/*.ipa
