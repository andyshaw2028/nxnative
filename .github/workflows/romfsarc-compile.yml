name: ROMFSARC compile and runtime check

on:
  push:
    branches:
      - botw-romfsarc-integration-work
    paths:
      - "dm/host/romfs_arc.c"
      - "dm/host/romfs_arc.h"
      - ".github/workflows/romfsarc-compile.yml"
  pull_request:
    branches:
      - botw-romfsarc-integration-work
    paths:
      - "dm/host/romfs_arc.c"
      - "dm/host/romfs_arc.h"
      - ".github/workflows/romfsarc-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile ROMFSARC source
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/romfsarc-build"
          cc -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra \
            -I dm/host \
            -c dm/host/romfs_arc.c \
            -o "$RUNNER_TEMP/romfsarc-build/romfs_arc.o"

      - name: Verify header can be included
        run: |
          set -eu
          printf '#include "romfs_arc.h"\nint main(void) { return 0; }\n' \
            > "$RUNNER_TEMP/romfsarc-build/header_check.c"
          cc -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra \
            -I dm/host \
            "$RUNNER_TEMP/romfsarc-build/header_check.c" \
            -o "$RUNNER_TEMP/romfsarc-build/header_check"
          "$RUNNER_TEMP/romfsarc-build/header_check"

      - name: Generate tiny ROMFSARC fixture
        run: |
          set -eu
          cat > "$RUNNER_TEMP/romfsarc-build/make_fixture.py" <<'PY'
          import os, struct, sys
          root = sys.argv[1]
          os.makedirs(root, exist_ok=True)
          files = [
              ("Pack/sample.txt", b"ROMFSARC test content\n"),
              ("Pack/Nested/nested.txt", b"nested-file-check\n"),
              ("System/binary.bin", bytes([0, 1, 2, 0x7f, 0x80, 0xfe, 0xff])),
              ("System/empty.dat", b""),
          ]
          files.sort(key=lambda x: x[0])
          dirs = ["", "Pack", "Pack/Nested", "System"]
          dirs.sort()
          pool = bytearray()
          offsets = {}
          for name in [d for d in dirs] + [p for p, _ in files]:
              if name not in offsets:
                  offsets[name] = len(pool)
                  pool.extend(name.encode("utf-8") + b"\0")
          shards = [bytearray(), bytearray()]
          file_records = []
          for i, (name, data) in enumerate(files):
              shard = i % 2
              off = len(shards[shard])
              shards[shard].extend(data)
              file_records.append(struct.pack("<IIQQII", offsets[name], shard, off, len(data), 0o644, 0))
          children = []
          dir_records = []
          for d in dirs:
              direct_dirs = [x for x in dirs if x and x.rpartition("/")[0] == d]
              direct_files = [p for p, _ in files if p.rpartition("/")[0] == d]
              entries = [(x.rpartition("/")[2], 0x80000000 | dirs.index(x)) for x in direct_dirs]
              entries += [(p.rpartition("/")[2], next(i for i,(fp,_) in enumerate(files) if fp == p)) for p in direct_files]
              entries.sort(key=lambda x: x[0])
              first = len(children)
              children.extend(tag for _, tag in entries)
              dir_records.append(struct.pack("<IIII", offsets[d], first, len(entries), 0))
          index_size = 64 + len(pool) + 32*len(file_records) + 16*len(dir_records) + 4*len(children)
          header = struct.pack("<8sIIQQQQQQ", b"ROMFSARC", 1, len(shards), index_size, len(files), len(dirs), len(pool), 0, 0)
          base = os.path.join(root, "testarc")
          with open(base + ".idx", "wb") as f:
              f.write(header); f.write(pool)
              for r in file_records: f.write(r)
              for r in dir_records: f.write(r)
              for child in children: f.write(struct.pack("<I", child))
          for i, data in enumerate(shards):
              with open(base + f".{i:02d}", "wb") as f: f.write(data)
          bad = os.path.join(root, "badarc.idx")
          with open(bad, "wb") as f: f.write(b"not an archive")
          print(f"fixture created: {base}.idx ({index_size} bytes)")
          PY
          python3 "$RUNNER_TEMP/romfsarc-build/make_fixture.py" "$RUNNER_TEMP/romfsarc-build/fixture"

      - name: Build ROMFSARC runtime test
        run: |
          set -eu
          cat > "$RUNNER_TEMP/romfsarc-build/romfsarc_runtime_test.c" <<'C'
          #include "romfs_arc.h"
          #include <errno.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          #define CHECK(c) do { if (!(c)) { fprintf(stderr, "FAIL line %d: %s (errno=%d)\n", __LINE__, #c, errno); return 1; } } while (0)

          int main(int argc, char **argv) {
              romfsarc_hdr h;
              uint32_t shard = 99;
              uint64_t off = 99, size = 99;
              char buf[128] = {0};
              romfsarc_ent ent[8];
              char badbase[1200];

              CHECK(argc == 2);
              CHECK(!romfsarc_active());
              CHECK(romfsarc_open(argv[1], &h) == 0);
              CHECK(romfsarc_active());
              CHECK(h.shard_count == 2 && h.file_count == 4 && h.dir_count == 4);
              CHECK(romfsarc_is_dir(""));
              CHECK(romfsarc_is_dir("Pack"));
              CHECK(romfsarc_is_dir("Pack/Nested"));
              CHECK(!romfsarc_is_dir("Pack/missing"));
              CHECK(romfsarc_stat_file("Pack/sample.txt", &shard, &off, &size) == 1);
              CHECK(size == 22 && shard < 2);
              CHECK(romfsarc_pread(shard, off, buf, 22) == 22);
              CHECK(memcmp(buf, "ROMFSARC test content\n", 22) == 0);
              memset(buf, 0, sizeof buf);
              CHECK(romfsarc_stat_file("Pack/Nested/nested.txt", &shard, &off, &size) == 1);
              CHECK(size == 18);
              CHECK(romfsarc_pread(shard, off, buf, 18) == 18);
              CHECK(memcmp(buf, "nested-file-check\n", 18) == 0);
              CHECK(romfsarc_stat_file("System/binary.bin", &shard, &off, &size) == 1);
              CHECK(size == 7 && romfsarc_pread(shard, off, buf, 7) == 7);
              CHECK((unsigned char)buf[0] == 0 && (unsigned char)buf[6] == 0xff);
              CHECK(romfsarc_stat_file("System/empty.dat", &shard, &off, &size) == 1 && size == 0);
              CHECK(romfsarc_stat_file("missing", NULL, NULL, NULL) == 0);
              CHECK(romfsarc_count("") == 2);
              CHECK(romfsarc_count("Pack") == 2);
              CHECK(romfsarc_count("Pack/Nested") == 1);
              CHECK(romfsarc_count("missing") == -1);
              CHECK(romfsarc_list("Pack", ent, 8) == 2);
              CHECK(strcmp(ent[0].name, "Nested") == 0 && ent[0].is_dir);
              CHECK(strcmp(ent[1].name, "sample.txt") == 0 && !ent[1].is_dir && ent[1].size == 22);
              CHECK(romfsarc_list("Pack", ent, 1) == 1);
              CHECK(romfsarc_list("missing", ent, 8) == -1);
              CHECK(snprintf(badbase, sizeof badbase, "%s/../badarc", argv[1]) > 0);
              CHECK(romfsarc_open(badbase, NULL) == -1);
              CHECK(romfsarc_active());
              memset(buf, 0, sizeof buf);
              CHECK(romfsarc_stat_file("Pack/sample.txt", &shard, &off, &size) == 1);
              CHECK(romfsarc_pread(shard, off, buf, 22) == 22);
              CHECK(memcmp(buf, "ROMFSARC test content\n", 22) == 0);
              romfsarc_close();
              CHECK(!romfsarc_active());
              CHECK(romfsarc_count("") == -1);
              CHECK(romfsarc_open(argv[1], NULL) == 0);
              CHECK(romfsarc_active());
              romfsarc_close();
              CHECK(!romfsarc_active());
              puts("ROMFSARC runtime tests: PASS");
              return 0;
          }
          C
          cc -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra \
            -I dm/host dm/host/romfs_arc.c \
            "$RUNNER_TEMP/romfsarc-build/romfsarc_runtime_test.c" \
            -pthread -o "$RUNNER_TEMP/romfsarc-build/romfsarc_runtime_test"

      - name: Run ROMFSARC runtime test
        run: |
          set -eu
          "$RUNNER_TEMP/romfsarc-build/romfsarc_runtime_test" \
            "$RUNNER_TEMP/romfsarc-build/fixture/testarc"
